<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1a14"/>
      <stop offset="1" stop-color="#110e0a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#e8913a"/>
      <stop offset="1" stop-color="#c8553d"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8913a"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="52" fill="url(#tile)"/>
  <rect x="10" y="10" width="236" height="236" rx="52" fill="none" stroke="url(#rim)" stroke-width="3" opacity="0.9"/>

  <!-- ledger rows -->
  <g stroke="#4a3f33" stroke-width="5" stroke-linecap="round">
    <line x1="58" y1="70" x2="198" y2="70"/>
    <line x1="58" y1="198" x2="198" y2="198"/>
  </g>

  <!-- spend bars: one spender dominates -->
  <rect x="66" y="150" width="26" height="40" rx="7" fill="#5c4d3c"/>
  <rect x="104" y="128" width="26" height="62" rx="7" fill="#7a6248"/>
  <rect x="142" y="84" width="34" height="106" rx="8" fill="url(#hot)" filter="url(#glow)"/>

  <!-- magnifier over the top spender -->
  <g filter="url(#glow)">
    <circle cx="159" cy="98" r="30" fill="none" stroke="#ffd27a" stroke-width="7"/>
    <line x1="181" y1="120" x2="204" y2="143" stroke="#ffd27a" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
